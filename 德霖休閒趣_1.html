<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── CONSTANTS ───────────────────────────────
const APP_NAME   = "德霖休閒趣";
const APP_SUB    = "DELIN FUN QUEST";
const ADMIN_PW   = "admin123";
const DEFAULT_CODE = "DELIN2025";
const LS_FB  = "delin_fb";
const LS_KEY = "delin_key";

const INIT_STAGES = [
  { id:1, title:"第一關：觀察力挑戰",
    hint:"仔細觀察活動現場，找出隱藏在四個角落的數字，從左上角順時針排列就是答案（4位數）。",
    answer:"1234", type:"text", photoDesc:"",
    okMsg:"🎉 答對了！繼續前進！", failHint:"提示：找找看四個角落各藏了什麼數字？" },
  { id:2, title:"第二關：全員合照任務",
    hint:"找到活動現場的特色地標，全組成員在地標前拍一張合照，上傳給系統確認！",
    answer:"", type:"photo", photoDesc:"照片中需要包含全組至少2位成員，且能清楚看到活動現場的特色地標或裝置。",
    okMsg:"📸 合照任務完成！繼續闖下一關！", failHint:"請確保照片清晰，且能看到全組成員和特色地標。" },
  { id:3, title:"第三關：數字邏輯",
    hint:"1、1、2、3、5、8、？——這是著名的數列，第七個數字是多少？",
    answer:"13", type:"text", photoDesc:"",
    okMsg:"🏆 恭喜完成所有關卡！你們是冠軍！", failHint:"每個數字等於前兩個數字的總和，算算看！" },
];

// ─── FIREBASE ────────────────────────────────
let _db = null;

function initFirebase(cfg) {
  try {
    firebase.apps.forEach(a => a.delete());
  } catch(e) {}
  const app = firebase.initializeApp(typeof cfg === 'string' ? JSON.parse(cfg) : cfg);
  _db = firebase.database(app);
}

const db = {
  async get(path) {
    if (!_db) return null;
    const s = await _db.ref(path).once('value');
    return s.val();
  },
  async set(path, val) {
    if (!_db) return;
    await _db.ref(path).set(val);
  },
  async del(path) {
    if (!_db) return;
    await _db.ref(path).remove();
  },
  on(path, cb) {
    if (!_db) return () => {};
    const ref = _db.ref(path);
    ref.on('value', s => cb(s.val()));
    return () => ref.off('value');
  },
};

// Firebase paths
const P = {
  players:  'game/players',
  player:   id => `game/players/${id}`,
  groups:   'game/groups',
  progress: gid => `game/progress/${gid}`,
  stages:   'game/stages',
  code:     'game/code',
};

// ─── CLAUDE API ──────────────────────────────
async function judgeText(answer, correct, hint, failHint, apiKey) {
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 200,
        system: `你是密室闖關遊戲裁判。正確答案是：${correct}。忽略大小寫、全半形、前後空格。只回傳JSON：{"correct":true/false,"message":"繁體中文訊息（不超過40字）"}`,
        messages: [{ role:'user', content:`關卡提示：${hint}\n玩家答案：${answer}\n備用提示：${failHint}` }],
      }),
    });
    const d = await res.json();
    return JSON.parse((d.content?.[0]?.text || '').replace(/```json|```/g,'').trim());
  } catch {
    const ok = answer.trim().toLowerCase() === correct.trim().toLowerCase();
    return { correct: ok, message: ok ? '答對了！' : failHint };
  }
}

async function judgePhoto(b64, mime, desc, failHint, apiKey) {
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 300,
        system: `你是密室闖關遊戲裁判，判斷照片是否符合要求。只回傳JSON：{"correct":true/false,"message":"繁體中文說明（不超過60字）"}`,
        messages: [{ role:'user', content: [
          { type:'image', source: { type:'base64', media_type: mime, data: b64 } },
          { type:'text', text: `照片要求：${desc}\n備用提示：${failHint}\n請判斷此照片是否符合要求。` },
        ]}],
      }),
    });
    const d = await res.json();
    return JSON.parse((d.content?.[0]?.text || '').replace(/```json|```/g,'').trim());
  } catch {
    return { correct: false, message: '照片判斷暫時失敗，請重試。' };
  }
}

function fileToB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res({ b64: r.result.split(',')[1], mime: file.type });
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ─── SMALL COMPONENTS ────────────────────────
function Rings() {
  return (
    <div className="rings" aria-hidden="true">
      <div className="ring r1"/><div className="ring r2"/><div className="ring r3"/>
      <div className="dot d1"/><div className="dot d2"/><div className="dot d3"/><div className="dot d4"/>
    </div>
  );
}

function SetupScreen({ onDone }) {
  const [fbCfg, setFbCfg] = useState('');
  const [apiKey, setApiKey] = useState('');
  const [err, setErr] = useState('');
  const [testing, setTesting] = useState(false);

  const save = async () => {
    setErr('');
    if (!fbCfg.trim()) { setErr('請貼上 Firebase 設定'); return; }
    if (!apiKey.trim()) { setErr('請輸入 Anthropic API Key'); return; }
    let parsed;
    try { parsed = JSON.parse(fbCfg.trim()); }
    catch { setErr('Firebase 設定格式錯誤，請確認是否為正確的 JSON'); return; }
    if (!parsed.databaseURL) { setErr('缺少 databaseURL，請確認已建立 Realtime Database'); return; }
    setTesting(true);
    try {
      initFirebase(parsed);
      await db.set('game/ping', Date.now());
      localStorage.setItem(LS_FB, JSON.stringify(parsed));
      localStorage.setItem(LS_KEY, apiKey.trim());
      onDone(apiKey.trim());
    } catch(e) {
      setErr('連線失敗：' + e.message);
    }
    setTesting(false);
  };

  return (
    <div className="screen">
      <Rings/>
      <div className="card setup-card">
        <div className="logo">
          <span className="logo-icon">🏕️</span>
          <h1>{APP_NAME}</h1>
          <p className="logo-sub">初次設定</p>
        </div>
        <p style={{fontSize:'.88rem',color:'#7AA0B8',marginBottom:'1rem',lineHeight:1.7}}>
          本系統需要 <b style={{color:'#EFF6FF'}}>Firebase</b>（免費同步資料庫）和 <b style={{color:'#EFF6FF'}}>Anthropic API Key</b>（AI 判題），請依照以下步驟完成設定：
        </p>
        <div className="setup-steps">
          <div className="setup-step">
            前往 <a href="https://console.firebase.google.com" target="_blank">console.firebase.google.com</a>，用 Google 帳號登入並建立新專案
          </div>
          <div className="setup-step">
            在專案中點選「<b>Realtime Database</b>」→「建立資料庫」→ 選擇「<b>測試模式</b>」
          </div>
          <div className="setup-step">
            回到「專案設定」→「您的應用程式」→ 點選「<b>&lt;/&gt; 網頁</b>」→ 複製 <b>firebaseConfig</b> 物件（JSON 格式）
          </div>
          <div className="setup-step">
            前往 <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> 取得 <b>API Key</b>
          </div>
        </div>
        <div className="note-box">⚠️ API Key 儲存在你的瀏覽器，請只在受信任的裝置上設定，且此系統僅供內部活動使用。</div>
        <div className="field mt-md">
          <label>Firebase 設定（JSON）</label>
          <textarea className="inp" rows={6} value={fbCfg} onChange={e => setFbCfg(e.target.value)}
            placeholder={'{\n  "apiKey": "...",\n  "databaseURL": "https://xxx.firebaseio.com",\n  ...\n}'}/>
        </div>
        <div className="field">
          <label>Anthropic API Key</label>

  );

// ─── GAME ────────────────────────────────────
function GameScreen({ player, apiKey }) {
  const [stages, setStages]  = useState(INIT_STAGES);
  const [groups, setGroups]  = useState([]);
  const [idx, setIdx]        = useState(0);
  const [answer, setAnswer]  = useState('');
  const [photo, setPhoto]    = useState(null);
  const [fb_, setFb]         = useState(null);
  const [loading, setLoading]= useState(false);
  const [done, setDone]      = useState(false);
  const [live, setLive]      = useState(false);
  const myGroupRef = useRef(null);

  const myGroup = groups.find(g => g.members?.some(m => m.id === player.id));
  if (myGroup) myGroupRef.current = myGroup;
  const ag = myGroup || myGroupRef.current;

  useEffect(() => {
    const u1 = db.on(P.stages, v => { if (v) setStages(Array.isArray(v)?v:Object.values(v)); });
    const u2 = db.on(P.groups, v => { setGroups(v ? (Array.isArray(v)?v:Object.values(v)) : []); setLive(true); });
    return () => { u1(); u2(); };
  }, []);

  useEffect(() => {
    if (!ag) return;
    const u = db.on(P.progress(ag.id), v => {
      if (v) {
        setIdx(v.idx || 0);
        if ((v.idx || 0) >= stages.length) setDone(true);
      }
    });
    return () => u();
  }, [ag?.id, stages.length]);

  const advance = async () => {
    if (!ag) return;
    const next = idx + 1;
    await db.set(P.progress(ag.id), { idx: next });
    if (next >= stages.length) setDone(true);
  };

  const handleText = async () => {
    const stage = stages[idx];
    if (!answer.trim() || !stage || loading) return;
    setLoading(true); setFb(null);
    const r = await judgeText(answer, stage.answer, stage.hint, stage.failHint, apiKey);
    setLoading(false);
    if (r.correct) {
      setFb({ ok:true, msg: stage.okMsg });
      setTimeout(() => { setAnswer(''); setFb(null); advance(); }, 2200);
    } else setFb({ ok:false, msg: r.message });
  };

  const handlePhoto = async () => {
    const stage = stages[idx];
    if (!photo?.file || !stage || loading) return;
    setLoading(true); setFb(null);
    try {
      const { b64, mime } = await fileToB64(photo.file);
      const r = await judgePhoto(b64, mime, stage.photoDesc || stage.hint, stage.failHint, apiKey);
      setLoading(false);
      if (r.correct) {
        setFb({ ok:true, msg: stage.okMsg });
        setTimeout(() => { setPhoto(null); setFb(null); advance(); }, 2200);
      } else setFb({ ok:false, msg: r.message });
    } catch { setLoading(false); setFb({ ok:false, msg:'照片上傳失敗，請重試。' }); }
  };

  if (done || idx >= stages.length) {
    return (
      <div className="screen"><Rings/>
        <div className="card" style={{textAlign:'center'}}>
          <span className="trophy-anim">🏆</span>
          <h2 className="finish-title">恭喜闖關成功！</h2>
          <p className="finish-sub">第 {ag?.id} 組完成全部關卡</p>
          <div className="chips" style={{justifyContent:'center',marginTop:'1rem'}}>
            {ag?.members?.map(m => <span key={m.id} className={`chip ${m.id===player.id?'chip-me':''}`}>{m.name}</span>)}
          </div>
          <div className="confetti-row">🎊 🎉 🎈 🎊</div>
        </div>
      </div>
    );
  }

  const stage = stages[idx];
  const pct = (idx / stages.length) * 100;

  return (
    <div className="screen">
      <Rings/>
      <div className="card game-card">
        <div className="row-between mb-sm">
          <div className="row-gap">
            <Tag v="coral">第 {ag?.id || '?'} 組</Tag>
            <SyncDot live={live}/>
          </div>
          <Tag v="teal">第 {idx+1} / {stages.length} 關</Tag>
        </div>
        <div className="prog-track">
          <div className="prog-fill" style={{width:`${pct}%`}}/>
          {stages.map((_,i) => (
            <div key={i} className={`prog-node ${i<idx?'nd-done':i===idx?'nd-cur':''}`}
              style={{left:`${stages.length===1?50:(i/(stages.length-1))*100}%`}}/>
          ))}
        </div>
        <h3 className="stage-h">{stage?.title}</h3>
        <div className="hint-box">
          <div className="hint-top">💡 關卡提示</div>
          <p className="hint-body">{stage?.hint}</p>
        </div>

        {stage?.type === 'photo' && (
          <div className="ans-area">
            <PhotoPicker preview={photo} setPreview={setPhoto}/>
            <button className={`btn btn-primary ${loading?'btn-spin':''}`}
              onClick={handlePhoto} disabled={loading||!photo}>
              {loading ? '🤖 AI 判斷中…' : '📤 提交照片'}
            </button>
          </div>
        )}
        {stage?.type === 'text' && (
          <div className="ans-area">
            <input className="inp" value={answer}
              onChange={e => { setAnswer(e.target.value); setFb(null); }}
              placeholder="輸入你的答案…" disabled={loading}
              onKeyDown={e => e.key==='Enter' && !loading && handleText()}/>
            <button className={`btn btn-primary ${loading?'btn-spin':''}`}
              onClick={handleText} disabled={loading||!answer.trim()}>
              {loading ? '🤖 AI 判斷中…' : '提交答案 →'}
            </button>
          </div>
        )}
        {stage?.type === 'both' && (
          <div className="ans-area">
            <PhotoPicker preview={photo} setPreview={setPhoto}/>
            <button className={`btn btn-secondary ${loading?'btn-spin':''}`}
              onClick={handlePhoto} disabled={loading||!photo}>
              {loading ? '判斷中…' : '📤 提交照片'}
            </button>
            <div className="or-line"><span>或輸入文字答案</span></div>
            <input className="inp" value={answer}
              onChange={e => { setAnswer(e.target.value); setFb(null); }}
              placeholder="輸入文字答案…" disabled={loading}
              onKeyDown={e => e.key==='Enter' && !loading && handleText()}/>
            <button className={`btn btn-primary ${loading?'btn-spin':''}`}
              onClick={handleText} disabled={loading||!answer.trim()}>
              {loading ? '判斷中…' : '提交文字 →'}
            </button>
          </div>
        )}

        {fb_ && (
          <div className={`fb ${fb_.ok?'fb-ok':'fb-err'}`}>
            <span>{fb_.ok?'✅':'❌'}</span>
            <p>{fb_.msg}</p>
          </div>
        )}

        <div className="team-row">
          <span className="muted-sm">隊友：</span>
          {ag?.members?.map(m => (
            <span key={m.id} className={`chip chip-sm ${m.id===player.id?'chip-me':''}`}>{m.name}</span>
          ))}
        </div>
      </div>
    </div>
  );
}

function AdminPanel({ onBack }) {
  const [tab, setTab]         = useState('stages');
  const [stages, setStages]   = useState(INIT_STAGES);
  const [players, setPlayers] = useState([]);
  const [groups, setGroups]   = useState([]);
  const [progMap, setProgMap] = useState({});
  const [grpSize, setGrpSize] = useState(3);
  const [gameCode, setGameCode]= useState(DEFAULT_CODE);
  const [editS, setEditS]     = useState(null);
  const [live, setLive]       = useState(false);

  useEffect(() => {
    const u1 = db.on(P.stages, v => { if (v) setStages(Array.isArray(v)?v:Object.values(v)); });
    const u2 = db.on(P.players, v => { setPlayers(v?Object.values(v):[]); setLive(true); });
    const u3 = db.on(P.groups, v => {
      const grps = v ? (Array.isArray(v)?v:Object.values(v)) : [];
      setGroups(grps);
    });
    const u4 = db.on(P.code, v => { if (v) setGameCode(v); });
    // progress per group
    const u5 = db.on('game/progress', v => {
      if (v) setProgMap(v);
    });
    return () => { u1(); u2(); u3(); u4(); u5(); };
  }, []);

  const saveStages = async (ns) => { setStages(ns); await db.set(P.stages, ns); };
  const saveCode   = async () => { await db.set(P.code, gameCode); alert(`遊戲代碼已更新：${gameCode}`); };

  const doGroup = async () => {
    if (!players.length) { alert('目前沒有玩家'); return; }
    const shuffled = [...players].sort(()=>Math.random()-.5);
    const ng = [];
    for (let i=0; i<shuffled.length; i+=grpSize)
      ng.push({ id: ng.length+1, members: shuffled.slice(i, i+grpSize) });
    await db.set(P.groups, ng);
    for (const g of ng) await db.set(P.progress(g.id), { idx:0 });
    alert(`✅ 分組完成，共 ${ng.length} 組！`);
  };

  const clearAll = async () => {
    if (!confirm('確認清除所有玩家和分組資料？')) return;
    await db.del(P.players);
    await db.del(P.groups);
    await db.del('game/progress');
    alert('已清除');
  };

  const TABS = [
    {k:'stages',l:'🗝 關卡'},{k:'players',l:'👥 玩家'},
    {k:'groups',l:'🏆 分組'},{k:'settings',l:'⚙️ 設定'},
  ];

  return (
    <div className="screen">
      <Rings/>
      <div className="card admin-card">
        <div className="row-between mb-md">
          <button className="back-btn" onClick={onBack}>← 返回</button>
          <h2 className="admin-h">⚙️ 管理後台</h2>
          <SyncDot live={live}/>
        </div>
        <div className="tab-bar">
          {TABS.map(t=>(
            <button key={t.k} className={`tab-btn ${tab===t.k?'active':''}`} onClick={()=>setTab(t.k)}>{t.l}</button>
          ))}
        </div>

        {/* STAGES */}
        {tab==='stages' && (
          <div className="tab-body">
            {stages.map((s,i)=>(
              <div key={s.id} className="s-item">
                {editS?.id===s.id ? (
                  <StageEditor s={editS} onChange={setEditS}
                    onSave={()=>{ saveStages(stages.map(x=>x.id===editS.id?editS:x)); setEditS(null); }}
                    onCancel={()=>setEditS(null)}/>
                ) : (
                  <div className="s-row">
                    <span className="s-num">第{i+1}關</span>
                    <span>{s.type==='photo'?'📷':s.type==='both'?'📝📷':'📝'}</span>
                    <span className="s-name">{s.title}</span>
                    <button className="icon-btn" onClick={()=>setEditS({...s})}>✏️</button>
                    <button className="icon-btn" onClick={()=>saveStages(stages.filter(x=>x.id!==s.id))}>🗑️</button>
                  </div>
                )}
              </div>
            ))}
            <button className="add-btn" onClick={()=>{
              const ns={id:Date.now(),title:`第${stages.length+1}關：新關卡`,hint:'',answer:'',type:'text',photoDesc:'',okMsg:'恭喜過關！',failHint:'再想想…'};
              saveStages([...stages,ns]); setEditS(ns);
            }}>＋ 新增關卡</button>
          </div>
        )}

        {/* PLAYERS */}
        {tab==='players' && (
          <div className="tab-body">
            <div className="row-between mb-sm">
              <span className="field-label">共 {players.length} 位玩家</span>
              <button className="btn btn-danger btn-xs" onClick={clearAll}>清除全部</button>
            </div>
            {players.length===0 ? <div className="empty">尚無玩家登入</div>
              : players.map(p=>{
                const g=groups.find(gr=>gr.members?.some(m=>m.id===p.id));
                const pi=g?(progMap[g.id]?.idx??0):null;
                return (
                  <div key={p.id} className="p-row">
                    <div className="p-av">{p.name[0]}</div>
                    <span className="p-name">{p.name}</span>
                    {g?<Tag v="teal">第{g.id}組</Tag>:<Tag v="gray">未分組</Tag>}
                    {pi!==null && <span className="muted-sm">第{pi+1}關</span>}
                  </div>
                );
              })
            }
          </div>
        )}

        {/* GROUPS */}
        {tab==='groups' && (
          <div className="tab-body">
            <div className="field mb-sm">
              <label className="field-label">每組人數</label>
              <div className="size-row">
                {[2,3,4,5,6].map(n=>(
                  <button key={n} className={`size-btn ${grpSize===n?'active':''}`} onClick={()=>setGrpSize(n)}>{n}人</button>
                ))}
              </div>
            </div>
            <button className="btn btn-primary mb-md" onClick={doGroup}>🎲 隨機分組</button>
            {groups.length===0 ? <div className="empty">尚未分組</div>
              : groups.map(g=>{
                const pi=progMap[g.id]?.idx??0;
                return (
                  <div key={g.id} className="g-item mb-xs">
                    <div className="row-between mb-xs">
                      <strong>第 {g.id} 組</strong>
                      <span className="muted-sm">第 {pi+1}/{stages.length} 關</span>
                    </div>
                    <div className="chips mb-xs">
                      {g.members?.map(m=><span key={m.id} className="chip chip-sm">{m.name}</span>)}
                    </div>
                    <div className="mini-prog"><div className="mini-fill" style={{width:`${(pi/stages.length)*100}%`}}/></div>
                  </div>
                );
              })
            }
          </div>
        )}

        {/* SETTINGS */}
        {tab==='settings' && (
          <div className="tab-body">
            <div className="field mb-md">
              <label className="field-label">遊戲代碼</label>
              <div className="code-row">
                <input className="inp" value={gameCode} onChange={e=>setGameCode(e.target.value.toUpperCase())} maxLength={12}/>
                <button className="btn btn-primary btn-inline" onClick={saveCode}>儲存</button>
              </div>
            </div>
            <div className="info-box">
              <p>🔑 <b>預設代碼：</b>{DEFAULT_CODE}</p>
              <p>🔒 <b>管理員密碼：</b>admin123</p>
              <p>🔄 <b>同步方式：</b>Firebase Realtime Database（即時推送）</p>
              <p>📷 <b>照片判斷：</b>由 Claude AI 自動審核</p>
              <p>🌐 <b>玩家加入：</b>掃描 QR Code 或開啟網址，無需安裝</p>
            </div>
            <button className="btn btn-danger mt-md btn-sm"
              onClick={()=>{ if(confirm('確認重設設定？系統將重新顯示設定頁面。')){ localStorage.removeItem(LS_FB); localStorage.removeItem(LS_KEY); location.reload(); }}}>
              🔧 重設系統設定
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── ROOT APP ────────────────────────────────
function App() {
  const [apiKey, setApiKey] = useState(null);
  const [screen, setScreen] = useState('login');
  const [player, setPlayer] = useState(null);

  useEffect(() => {
    const fbCfg = localStorage.getItem(LS_FB);
    const key   = localStorage.getItem(LS_KEY);
    if (fbCfg && key) {
      initFirebase(fbCfg);
      setApiKey(key);
    }
  }, []);

  if (!apiKey) {
    return <SetupScreen onDone={key => setApiKey(key)}/>;
  }

  return (
    <>
      {screen==='login' && (
        <LoginScreen
          onLogin={n => { setPlayer({ id: Date.now(), name: n }); setScreen('lobby'); }}
          onAdmin={() => setScreen('admin')}/>
      )}
      {screen==='lobby' && player && (
        <LobbyScreen player={player} onStart={() => setScreen('game')} onAdmin={() => setScreen('admin')}/>
      )}
      {screen==='game' && player && (
        <GameScreen player={player} apiKey={apiKey}/>
      )}
      {screen==='admin' && (
        <AdminPanel onBack={() => setScreen(player ? 'lobby' : 'login')}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
